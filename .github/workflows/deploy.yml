name: Deploy

# Manual only, and deliberately so. A deploy to a live access-governance fleet is a decision, not
# a consequence of merging. Triggering on push would also mean any change to a document redeploys
# production, which is how a fleet ends up running a revision nobody chose.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "What to deploy"
        required: true
        default: runtime
        type: choice
        options:
          - runtime
          - workers
          - both

run-name: "Deploy ${{ inputs.target }} (${{ github.actor }})"

# No service-account key exists. `id-token: write` lets GitHub mint a short-lived OIDC token that
# the pool exchanges for a short-lived Google token, scoped by the provider's attribute condition
# to this repository alone.
permissions:
  contents: read
  id-token: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  gate:
    name: Offline gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOOGLE_CLOUD_PROJECT: "bastion-ci-mock"
      GOOGLE_CLOUD_LOCATION: "global"
      GOOGLE_GENAI_USE_VERTEXAI: "TRUE"
      GCP_PROJECT_ID: "bastion-ci-mock"
      GCP_REGION: "europe-north2"
      VERTEX_AI_MODEL: "gemini-3.5-flash"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      # The same gate a tag has to pass. Deploying code that could not be released is how a fleet
      # and its repository drift apart, which is the failure this project argues against.
      - run: ruff check . && ruff format --check .
      - run: mypy agents gateway identity registry runtime model_armor observability infrastructure
      - run: pytest tests --cov --cov-fail-under=100
      - run: python scripts/check_docs.py
      - run: python scripts/check_versions.py

  deploy:
    name: Deploy to bastion-fleet-2026
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # A GitHub environment gives this a second, human-owned approval gate if one is configured on
    # it. Without a configured reviewer the job still runs, so the environment is a place to add
    # that control rather than a claim that it is already enforced.
    environment: production
    steps:
      - uses: actions/checkout@v4

      # Fail here, with the list, rather than four steps later inside the auth action with a
      # message that says only that federation did not work. Only names are printed, never
      # values, so a misconfiguration is reported without publishing what is configured.
      - name: Check the deploy configuration is complete
        env:
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_DEPLOY_SA: ${{ vars.GCP_DEPLOY_SA }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          AGENT_RUNTIME_REGION: ${{ vars.AGENT_RUNTIME_REGION }}
          VERTEX_AI_MODEL: ${{ vars.VERTEX_AI_MODEL }}
          MODEL_ARMOR_LOCATION: ${{ vars.MODEL_ARMOR_LOCATION }}
          MODEL_ARMOR_TEMPLATE_ID: ${{ vars.MODEL_ARMOR_TEMPLATE_ID }}
          BASTION_RUNTIME_AGENT_ENGINE_ID: ${{ vars.BASTION_RUNTIME_AGENT_ENGINE_ID }}
          BASTION_MEMORY_AGENT_ENGINE_ID: ${{ vars.BASTION_MEMORY_AGENT_ENGINE_ID }}
          BASTION_SESSION_SERVICE_URI: ${{ vars.BASTION_SESSION_SERVICE_URI }}
          BASTION_MEMORY_SERVICE_URI: ${{ vars.BASTION_MEMORY_SERVICE_URI }}
          BASTION_FINDING_HMAC_SECRET: ${{ vars.BASTION_FINDING_HMAC_SECRET }}
          BASTION_A2A_SHARED_SECRET_ID: ${{ vars.BASTION_A2A_SHARED_SECRET_ID }}
          PUBSUB_TOPIC: ${{ vars.PUBSUB_TOPIC }}
          BASTION_APPROVER_PRINCIPAL: ${{ vars.BASTION_APPROVER_PRINCIPAL }}
        run: |
          set -euo pipefail
          missing=""
          for name in GCP_WIF_PROVIDER GCP_DEPLOY_SA GCP_PROJECT_ID GCP_REGION \
                      AGENT_RUNTIME_REGION VERTEX_AI_MODEL MODEL_ARMOR_LOCATION \
                      MODEL_ARMOR_TEMPLATE_ID BASTION_RUNTIME_AGENT_ENGINE_ID \
                      BASTION_MEMORY_AGENT_ENGINE_ID BASTION_SESSION_SERVICE_URI \
                      BASTION_MEMORY_SERVICE_URI BASTION_FINDING_HMAC_SECRET \
                      BASTION_A2A_SHARED_SECRET_ID PUBSUB_TOPIC; do
            if [ -z "${!name:-}" ]; then
              missing="$missing $name"
            fi
          done
          # Optional by design. deploy.sh already reports that without it no human can approve
          # an exception; that is a degraded deploy, not a broken one, and the platform owner
          # may reasonably decline to put a named human into repository variables.
          if [ -z "${BASTION_APPROVER_PRINCIPAL:-}" ]; then
            echo "::warning::BASTION_APPROVER_PRINCIPAL is unset - the deployed fleet will have no human able to approve an exception."
          fi
          if [ -n "$missing" ]; then
            echo "::error::Missing repository variables:$missing"
            echo "Settings -> Secrets and variables -> Actions -> Variables."
            echo "infrastructure/provision_wif.sh prints the two federation values; the rest are"
            echo "the same ids and regions a local deploy reads from .env. None is a secret:"
            echo "the two BASTION_*_SECRET* variables are Secret Manager resource ids, and the"
            echo "secret material itself is mounted by Cloud Run, never handled here."
            exit 78
          fi
          echo "All required deploy variables are present."

      - name: Authenticate by federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt

      # Every value the deploy scripts read, declared here rather than sourced from a .env that
      # does not exist on a runner. `.env.example` is the contract these must satisfy, and
      # tests/unit/test_environment_contract.py fails when the two drift.
      - name: Deploy
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GOOGLE_CLOUD_LOCATION: global
          GOOGLE_GENAI_USE_VERTEXAI: "TRUE"
          VERTEX_AI_MODEL: ${{ vars.VERTEX_AI_MODEL }}
          AGENT_RUNTIME_REGION: ${{ vars.AGENT_RUNTIME_REGION }}
          MODEL_ARMOR_LOCATION: ${{ vars.MODEL_ARMOR_LOCATION }}
          MODEL_ARMOR_TEMPLATE_ID: ${{ vars.MODEL_ARMOR_TEMPLATE_ID }}
          BASTION_RUNTIME_AGENT_ENGINE_ID: ${{ vars.BASTION_RUNTIME_AGENT_ENGINE_ID }}
          BASTION_MEMORY_AGENT_ENGINE_ID: ${{ vars.BASTION_MEMORY_AGENT_ENGINE_ID }}
          BASTION_SESSION_SERVICE_URI: ${{ vars.BASTION_SESSION_SERVICE_URI }}
          BASTION_MEMORY_SERVICE_URI: ${{ vars.BASTION_MEMORY_SERVICE_URI }}
          BASTION_FINDING_HMAC_SECRET: ${{ vars.BASTION_FINDING_HMAC_SECRET }}
          BASTION_A2A_SHARED_SECRET_ID: ${{ vars.BASTION_A2A_SHARED_SECRET_ID }}
          BASTION_APPROVER_PRINCIPAL: ${{ vars.BASTION_APPROVER_PRINCIPAL }}
          PUBSUB_TOPIC: ${{ vars.PUBSUB_TOPIC }}
        run: |
          set -euo pipefail
          # This repository is public, so this log is world-readable. `deploy.sh` silences the
          # IAM policy dumps itself, but `gcloud run deploy` reports each Service URL on stderr
          # and those origins are the private A2A peer endpoints - the same values the
          # dispatcher is deliberately not allowed to hold. Redact on the way to the log rather
          # than in the script: an operator running `deploy.sh` by hand needs to read them.
          # This filter rewrites text, it does not drop it, so a failure still reports in full.
          redact() {
            sed -E \
              -e 's#https://[A-Za-z0-9._-]+\.run\.app#https://REDACTED.run.app#g' \
              -e 's#[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.iam\.gserviceaccount\.com#REDACTED-SERVICE-ACCOUNT#g' \
              -e 's#(user|group|domain|serviceAccount|principalSet|principal):[^ ",]+#\1:REDACTED#g'
          }
          {
            case "${{ inputs.target }}" in
              workers|both) bash infrastructure/deploy.sh ;;
            esac
            case "${{ inputs.target }}" in
              runtime|both) python -m infrastructure.deploy_agent_runtime ;;
            esac
          } 2>&1 | redact

      # Read-only. Deploying without checking the result is how a fleet reports success while
      # serving a revision that cannot complete an investigation.
      - name: Verify the deployed fleet
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GOOGLE_CLOUD_LOCATION: global
          AGENT_RUNTIME_REGION: ${{ vars.AGENT_RUNTIME_REGION }}
          MODEL_ARMOR_LOCATION: ${{ vars.MODEL_ARMOR_LOCATION }}
          MODEL_ARMOR_TEMPLATE_ID: ${{ vars.MODEL_ARMOR_TEMPLATE_ID }}
          BASTION_RUNTIME_AGENT_ENGINE_ID: ${{ vars.BASTION_RUNTIME_AGENT_ENGINE_ID }}
        run: python -m infrastructure.verify_fleet
