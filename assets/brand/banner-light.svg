<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Bastion — a private enterprise agent fleet for access governance">
  <title>Bastion — three ADK agents auditing a live GCP IAM policy, including their own</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect x="0" y="316" width="1200" height="4" fill="#F59E0B"/>

  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
    <text x="64" y="100" font-size="64" font-weight="700" letter-spacing="1" fill="#0B1B2B">BASTION</text>
    <text x="66" y="136" font-size="21" fill="#334155">The access review that reviews itself.</text>
    <text x="66" y="168" font-size="16" fill="#64748B">Three ADK agents audit a live GCP IAM policy, including their own.</text>
    <text x="66" y="198" font-size="15" font-weight="600" fill="#1D4ED8">All Things Agentic Hackathon 2026 · Fortified Enterprise Fleet</text>

    <g transform="translate(66 236)">
      <rect width="152" height="34" rx="17" fill="#FFFFFF" stroke="#B8C9DC"/>
      <circle cx="18" cy="17" r="7" fill="#16A34A">
        <animate attributeName="opacity" values="1;.35;1" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <text x="34" y="23" font-size="14" font-weight="700" fill="#10233D">PRIVATE · LIVE</text>
    </g>
    <text x="236" y="258" font-size="15" fill="#4B627E">21/21 APIs enabled · 33 deployed resources</text>

    <!-- The control-plane hub mirrors the diagrams and the 16x9 title card, rather than a
         standalone padlock mark: one visual language for "what Bastion is" everywhere it
         appears. Ring and halo durations are 6s/3s so they loop seamlessly if this file is
         ever captured as a GIF (see scripts/render_diagrams.py). -->
    <text x="880" y="52" text-anchor="middle" font-size="12" font-weight="800" letter-spacing="3" fill="#2563EB">GOVERNED CONTROL PLANE</text>
    <g transform="translate(880 140)">
      <circle r="70" fill="none" stroke="#2563EB" stroke-width="2" stroke-dasharray="6 13" opacity=".4">
        <animateTransform attributeName="transform" type="rotate" values="0;22;0" keyTimes="0;0.5;1" dur="6s" repeatCount="indefinite"/>
      </circle>
      <circle r="50" fill="#DBEAFE" opacity=".75">
        <animate attributeName="r" values="46;53;46" dur="3s" repeatCount="indefinite"/>
      </circle>
      <g transform="scale(0.34)">
        <path d="M0 -124 L102 -84 V-8 C102 80 44 127 0 146 C-44 127-102 80-102-8 V-84Z" fill="url(#core)"/>
        <path d="M-42 4 L-9 37 L51 -31" fill="none" stroke="white" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- The three real, deployed agents: one managed Runtime plus two A2A workers. -->
    <g transform="translate(706 234)"><rect width="138" height="44" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/><rect width="138" height="6" rx="3" fill="#2563EB"/><text x="69" y="30" text-anchor="middle" font-size="13" font-weight="700" fill="#10233D">ORCHESTRATOR</text></g>
    <g transform="translate(856 234)"><rect width="138" height="44" rx="10" fill="#FFFFFF" stroke="#06B6D4" stroke-width="2"/><rect width="138" height="6" rx="3" fill="#06B6D4"/><text x="69" y="30" text-anchor="middle" font-size="13" font-weight="700" fill="#10233D">ACCESS AUDITOR</text></g>
    <g transform="translate(1006 234)"><rect width="138" height="44" rx="10" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/><rect width="138" height="6" rx="3" fill="#F59E0B"/><text x="69" y="30" text-anchor="middle" font-size="13" font-weight="700" fill="#10233D">ESCALATION</text></g>
  </g>
</svg>
