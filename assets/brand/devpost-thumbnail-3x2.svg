<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Bastion catalogued agents, durable context, and governed production access">
  <title>Bastion — governed enterprise agent fleet</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6F8FC"/>
      <stop offset="1" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#DCE5F2" stroke-width="1"/>
    </pattern>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#36597B" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#grid)" opacity=".75"/>
  <rect width="1200" height="9" fill="#F59E0B"/>
  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
    <text x="70" y="98" font-size="28" font-weight="800" letter-spacing="7" fill="#2563EB">BASTION</text>
    <text x="70" y="146" font-size="25" font-weight="700" fill="#10233D">The private agent fleet that audits its own cloud.</text>
    <text x="70" y="184" font-size="18" fill="#4B627E">Real IAM in. Minimized findings out. Human decisions remembered.</text>

    <g transform="translate(832 64)">
      <rect width="298" height="54" rx="27" fill="#FFFFFF" stroke="#B8C9DC"/>
      <circle cx="29" cy="27" r="8" fill="#16A34A"/>
      <text x="50" y="34" font-size="18" font-weight="800" fill="#10233D">PRIVATE FLEET · LIVE</text>
    </g>

    <g transform="translate(600 418)">
      <circle r="192" fill="#DBEAFE" opacity=".75"/>
      <circle r="145" fill="#FFFFFF" stroke="#2563EB" stroke-width="4" filter="url(#lift)"/>
      <path d="M0 -101 L80 -70 V-8 C80 60 36 100 0 117 C-36 100-80 60-80-8 V-70Z" fill="url(#shield)"/>
      <path d="M-33 1 L-7 27 L40 -25" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="155" text-anchor="middle" font-size="18" font-weight="800" fill="#10233D">POLICY BEFORE MODEL</text>
    </g>

    <g filter="url(#lift)">
      <g transform="translate(68 292)">
        <rect width="320" height="118" rx="18" fill="#FFFFFF" stroke="#2563EB" stroke-width="3"/>
        <rect width="320" height="9" rx="4" fill="#2563EB"/>
        <text x="25" y="49" font-size="18" font-weight="800" fill="#2563EB">CATALOGUED AGENTS</text>
        <text x="25" y="80" font-size="16" fill="#4B627E">owner · skill · identity · approval</text>
      </g>
      <g transform="translate(68 472)">
        <rect width="320" height="118" rx="18" fill="#FFFFFF" stroke="#06B6D4" stroke-width="3"/>
        <rect width="320" height="9" rx="4" fill="#06B6D4"/>
        <text x="25" y="49" font-size="18" font-weight="800" fill="#06748A">DURABLE CONTEXT</text>
        <text x="25" y="80" font-size="16" fill="#4B627E">leases · dedupe · human exceptions</text>
      </g>
      <g transform="translate(812 292)">
        <rect width="320" height="118" rx="18" fill="#FFFFFF" stroke="#16A34A" stroke-width="3"/>
        <rect width="320" height="9" rx="4" fill="#16A34A"/>
        <text x="25" y="49" font-size="18" font-weight="800" fill="#147A36">GOVERNED IAM READ</text>
        <text x="25" y="80" font-size="16" fill="#4B627E">raw policy stops before Gemini</text>
      </g>
      <g transform="translate(812 472)">
        <rect width="320" height="118" rx="18" fill="#FFFFFF" stroke="#F59E0B" stroke-width="3"/>
        <rect width="320" height="9" rx="4" fill="#F59E0B"/>
        <text x="25" y="49" font-size="18" font-weight="800" fill="#A45E00">DEPARTMENT ACTION</text>
        <text x="25" y="80" font-size="16" fill="#4B627E">validated · count-only · idempotent</text>
      </g>
    </g>

    <g transform="translate(70 700)">
      <rect width="1060" height="1" fill="#B8C9DC"/>
      <text y="39" font-size="18" font-weight="800" fill="#10233D">GOOGLE ADK · GEMINI 3.5 FLASH · GOOGLE CLOUD</text>
      <text x="770" y="39" font-size="17" font-weight="700" fill="#4B627E">READ-ONLY BY DESIGN</text>
    </g>
  </g>
</svg>
