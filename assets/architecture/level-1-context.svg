<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080"
     role="img" aria-labelledby="t1 d1">
  <title id="t1">Bastion — Level 1: Context</title>
  <desc id="d1">Cloud Scheduler opens a review; the Bastion fleet of three ADK agents reads the
  live GCP IAM policy read-only through Cloud Asset Inventory, asks Gemini 3.5 Flash for
  rationale only, and escalates to the department that owns each principal. A dotted return
  edge shows that the policy being read contains the service accounts Bastion itself runs
  under. The private Cloud Run fleet and Eventarc inbox are deployed; scheduler cadence and
  retained end-to-end evidence remain deliberately distinct.</desc>

  <!-- Hand-placed on purpose. Auto-layout produced the unreadable diagram this replaced.
       16:9 at 1920x1080 so a frame can be dropped straight into an OBS scene. -->
  <style>
/* PALETTE:LIGHT */
svg {
  --bg:#FFFFFF; --card:#F1F3F4; --card-2:#E8EAED; --edge:#5F6368; --grid:#E8EAED;
  --ink:#202124; --muted:#5F6368; --blue:#4285F4; --blue-d:#1A73E8;
  --red:#EA4335; --red-d:#C5221F; --green:#34A853; --green-d:#137333;
  --amber:#FBBC04; --on-accent:#FFFFFF;
}
/* /PALETTE:LIGHT */
/* PALETTE:DARK */
@media (prefers-color-scheme: dark) {
svg {
  --bg:#0D1117; --card:#161B22; --card-2:#21262D; --edge:#8B949E; --grid:#21262D;
  --ink:#E6EDF3; --muted:#8B949E; --blue:#4285F4; --blue-d:#8AB4F8;
  --red:#EA4335; --red-d:#F28B82; --green:#34A853; --green-d:#81C995;
  --amber:#FBBC04; --on-accent:#FFFFFF;
}
}
/* /PALETTE:DARK */

.bg      { fill: var(--bg); }
.grid    { stroke: var(--grid); stroke-width: 1; }
.h1      { fill: var(--ink);   font: 700 44px 'Segoe UI', system-ui, -apple-system, sans-serif; }
.h2      { fill: var(--muted); font: 400 22px 'Segoe UI', system-ui, -apple-system, sans-serif; }
.box     { fill: var(--card); stroke: var(--edge); stroke-width: 2; rx: 14; }
.label   { fill: var(--ink);   font: 600 30px 'Segoe UI', system-ui, -apple-system, sans-serif; text-anchor: middle; }
.sub     { fill: var(--muted); font: 400 20px 'Segoe UI', system-ui, -apple-system, sans-serif; text-anchor: middle; }
.on      { fill: var(--on-accent); }
.on-sub  { fill: #E8F0FE; font: 400 20px 'Segoe UI', system-ui, -apple-system, sans-serif; text-anchor: middle; }
.edgeline{ stroke: var(--edge); stroke-width: 3; fill: none; }
.edgetxt { fill: var(--muted); font: 400 20px 'Segoe UI', system-ui, -apple-system, sans-serif; text-anchor: middle; }
.legend  { fill: var(--muted); font: 400 21px 'Segoe UI', system-ui, -apple-system, sans-serif; }
.foot    { fill: var(--muted); font: 400 20px 'Segoe UI', system-ui, -apple-system, sans-serif; }
.footb   { fill: var(--ink);   font: 700 20px 'Segoe UI', system-ui, -apple-system, sans-serif; }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--edge)"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--red-d)"/>
    </marker>
    <linearGradient id="control-core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="var(--blue)"/><stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="control-lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity=".24"/>
    </filter>
  </defs>

  <rect class="bg" x="0" y="0" width="1920" height="1080"/>
  <line class="grid" x1="60" y1="150" x2="1860" y2="150"/>
  <line class="grid" x1="60" y1="1000" x2="1860" y2="1000"/>

  <text class="h1" x="60" y="86">Bastion — Level 1 · Context</text>
  <text class="h2" x="60" y="126">What the fleet talks to. Every marker is measured from gcp-state.json, never typed.</text>

  <!-- Gemini, top right -->
  <g>
    <rect class="box" x="1300" y="190" width="440" height="130"/>
    <text class="label" x="1520" y="248">Gemini 3.5 Flash</text>
    <text class="sub"   x="1520" y="284">Vertex AI · locations/global · ● 5 calls observed</text>
  </g>

  <!-- Cloud Scheduler, left -->
  <g>
    <rect class="box" x="70" y="470" width="290" height="150"/>
    <text class="label" x="215" y="530">Cloud Scheduler</text>
    <text class="sub"   x="215" y="566">makes “continuous” literal</text>
    <text class="sub"   x="215" y="596">◐ enabled, no job</text>
  </g>

  <!-- BASTION, centre: a visible control plane rather than an anonymous blue box. -->
  <g>
    <circle cx="900" cy="545" r="254" fill="none" stroke="var(--blue)" stroke-width="2" stroke-dasharray="8 17" opacity=".35">
      <animateTransform attributeName="transform" type="rotate" values="0 900 545;22 900 545;0 900 545" keyTimes="0;0.5;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="900" cy="545" r="222" fill="var(--blue)" opacity=".08">
      <animate attributeName="r" values="210;230;210" dur="3s" repeatCount="indefinite"/>
    </circle>
    <rect x="610" y="396" width="580" height="296" rx="28" fill="var(--card)" stroke="var(--blue)" stroke-width="4" filter="url(#control-lift)"/>
    <rect x="610" y="396" width="580" height="14" rx="7" fill="url(#control-core)"/>
    <path d="M704 454 L760 476 V518 C760 566 728 593 704 605 C680 593 648 566 648 518 V476Z" fill="url(#control-core)"/>
    <path d="M676 521 L696 541 L733 503" fill="none" stroke="white" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="792" y="470" style="fill:var(--blue);font:700 17px 'Segoe UI',system-ui,sans-serif;letter-spacing:3px">GOVERNED CONTROL PLANE</text>
    <text x="792" y="516" style="fill:var(--ink);font:700 34px 'Segoe UI',system-ui,sans-serif">BASTION</text>
    <text x="792" y="552" style="fill:var(--muted);font:400 20px 'Segoe UI',system-ui,sans-serif">three isolated ADK agents · private A2A</text>
    <line x1="648" y1="626" x2="1152" y2="626" stroke="var(--grid)" stroke-width="2"/>
    <text x="674" y="660" style="fill:var(--green-d);font:700 18px 'Segoe UI',system-ui,sans-serif">● LIVE</text>
    <text x="760" y="660" style="fill:var(--muted);font:400 18px 'Segoe UI',system-ui,sans-serif">Cloud Run · Eventarc · Agent Registry</text>
  </g>

  <!-- LIVE IAM, right -->
  <g>
    <rect x="1440" y="450" width="410" height="190" rx="16"
          fill="var(--red)" stroke="var(--red-d)" stroke-width="4"/>
    <text class="label on" x="1645" y="516">LIVE GCP IAM POLICY</text>
    <text class="on-sub"   x="1645" y="554">Cloud Asset Inventory · read-only</text>
    <text class="on-sub"   x="1645" y="600">● real principals, no fixture</text>
    <animate attributeName="opacity" values="1;0.82;1" dur="3s" repeatCount="indefinite"/>
  </g>

  <!-- Departments, bottom -->
  <g>
    <rect class="box" x="470" y="830" width="270" height="110"/>
    <text class="label" x="605" y="882">data-platform</text>
    <text class="sub"   x="605" y="914">owns bq / dataflow SAs</text>

    <rect class="box" x="765" y="830" width="270" height="110"/>
    <text class="label" x="900" y="882">ml-engineering</text>
    <text class="sub"   x="900" y="914">owns vertex / training SAs</text>

    <rect class="box" x="1060" y="830" width="270" height="110"/>
    <text class="label" x="1195" y="882">platform-infra</text>
    <text class="sub"   x="1195" y="914">owns the default compute SA</text>
  </g>

  <!-- Edges -->
  <path class="edgeline" id="e-sched" d="M360 545 L600 545" marker-end="url(#arrow)"/>
  <text class="edgetxt" x="495" y="525">opens a review</text>

  <path class="edgeline" id="e-iam" d="M1200 545 L1430 545" stroke-width="6" marker-end="url(#arrow)"/>
  <text class="edgetxt" x="1295" y="498">reads, read-only</text>

  <path d="M1440 610 C1300 720, 1060 720, 940 702" fill="none"
        stroke="var(--red-d)" stroke-width="3" stroke-dasharray="10 10" marker-end="url(#arrow-red)">
    <animate attributeName="stroke-dashoffset" from="40" to="0" dur="1.5s" repeatCount="indefinite"/>
  </path>
  <text class="edgetxt" x="1230" y="726" fill="var(--red-d)">contains Bastion’s own service accounts</text>

  <path class="edgeline" d="M1200 450 C1230 360, 1250 300, 1292 268" marker-end="url(#arrow)"/>
  <text class="edgetxt" x="1215" y="372">rationale only — never the raw policy</text>

  <path class="edgeline" d="M900 702 L900 820" marker-end="url(#arrow)"/>
  <path class="edgeline" d="M840 702 C700 760, 640 780, 610 820" marker-end="url(#arrow)"/>
  <path class="edgeline" d="M960 702 C1100 760, 1160 780, 1190 820" marker-end="url(#arrow)"/>
  <text class="edgetxt" x="420" y="742">escalates to the team that owns the principal</text>

  <!-- One investigation, in two beats: green out, red back to the owning teams.
       The dots only ever travel edges that are already drawn with an arrow and labelled, so a
       reader who suppresses animation loses nothing — motion is decoration here, not the sole
       carrier of a fact (assets/README.md).
       Green is hidden while inside the BASTION card. A travelling dot means "in transit along
       this edge"; sliding one across a component's own label says the request is skimming over
       the agent rather than being handled by it. Those opacity keyTimes are derived from where
       the path crosses x=630 and x=1160 — the card's edges — as a fraction of the path length. -->
  <!-- Never animate a packet through a component. Two edge-local packets make the hand-off
       explicit: one reaches the private control plane, the next leaves it for the IAM read. -->
  <circle r="11" fill="var(--green)">
    <animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.04;0.23;1"
                   calcMode="linear" path="M360 545 L600 545"/>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.23;0.27;1"
             dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle r="11" fill="var(--green)">
    <animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.42;0.61;1"
                   calcMode="linear" path="M1200 545 L1430 545"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.38;0.42;0.61;0.65;1"
             dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- The findings, fanning out to the teams that own the principals. Three dots rather than
       one because the claim is that a single investigation reaches several departments — and
       the run behind this diagram routed two findings to two different owners. Red, because
       what travels here is a finding about the real policy, and green is the request. -->
  <g fill="var(--red)">
    <circle r="10">
      <animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;0;1;1"
                     keyTimes="0;0.55;0.80;1" calcMode="linear"
                     path="M840 702 C700 760, 640 780, 610 820"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.58;0.80;0.84;1"
               dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle r="10">
      <animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;0;1;1"
                     keyTimes="0;0.55;0.80;1" calcMode="linear" path="M900 702 L900 820"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.58;0.80;0.84;1"
               dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle r="10">
      <animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;0;1;1"
                     keyTimes="0;0.55;0.80;1" calcMode="linear"
                     path="M960 702 C1100 760, 1160 780, 1190 820"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.58;0.80;0.84;1"
               dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Legend + measured footer -->
  <g>
    <circle cx="74" cy="1046" r="9" fill="var(--green-d)"/>
    <text class="legend" x="92" y="1054">ran and was captured</text>
    <circle cx="360" cy="1046" r="9" fill="var(--amber)"/>
    <text class="legend" x="378" y="1054">API enabled, nothing wired</text>
    <circle cx="720" cy="1046" r="9" fill="none" stroke="var(--edge)" stroke-width="2"/>
    <text class="legend" x="738" y="1054">not started</text>
  </g>
  <text class="footb" x="1860" y="1046" text-anchor="end">Build state · 2026-08-16 · 21/21 APIs · 33 deployed resources</text>
  <text class="foot"  x="1860" y="1016" text-anchor="end">Managed Runtime + Gateway + durable Eventarc fleet live · Scheduler is outside this deployment.</text>
</svg>
