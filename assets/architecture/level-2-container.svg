<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080"
     role="img" aria-labelledby="t2 d2">
  <title id="t2">Bastion — Level 2: Container</title>
  <desc id="d2">Inside Bastion. Three ADK agents run as sub-agents of one SequentialAgent:
  Access Auditor reads the live IAM policy through Cloud Asset Inventory, the Orchestrator
  applies policy rules and resolves the owning department for each principal, and the
  Escalation Agent fans findings out to the teams that own them. Every model call is screened
  by Model Armor at ADK's before_model_callback before it reaches Gemini. An audit BasePlugin
  records every event with no call site in any agent. Memory Bank is not deployed, so nothing
  suppresses a finding a human already accepted.</desc>

  <!-- Hand-placed on purpose. 16:9 at 1920x1080 so a frame drops straight into an OBS scene. -->
  <style>
/* PALETTE:LIGHT */
svg {
  --bg:#FFFFFF; --card:#F1F3F4; --card-2:#E8EAED; --edge:#5F6368; --grid:#E8EAED;
  --ink:#202124; --muted:#5F6368; --blue:#4285F4; --blue-d:#1A73E8;
  --red:#EA4335; --red-d:#C5221F; --green:#34A853; --green-d:#137333;
  --amber:#FBBC04; --amber-d:#EA8600; --ghost:#9AA0A6; --on-accent:#FFFFFF;
  --group:#FAFAFA;
}
/* /PALETTE:LIGHT */
/* PALETTE:DARK */
@media (prefers-color-scheme: dark) {
svg {
  --bg:#0D1117; --card:#161B22; --card-2:#21262D; --edge:#8B949E; --grid:#21262D;
  --ink:#E6EDF3; --muted:#8B949E; --blue:#4285F4; --blue-d:#8AB4F8;
  --red:#EA4335; --red-d:#F28B82; --green:#34A853; --green-d:#81C995;
  --amber:#FBBC04; --amber-d:#F9CE63; --ghost:#6E7681; --on-accent:#FFFFFF;
  --group:#11161D;
}
}
/* /PALETTE:DARK */

.bg      { fill: var(--bg); }
.grid    { stroke: var(--grid); stroke-width: 1; }
.h1      { fill: var(--ink);   font: 700 44px 'Segoe UI', system-ui, -apple-system, sans-serif; }
.h2      { fill: var(--muted); font: 400 22px 'Segoe UI', system-ui, -apple-system, sans-serif; }
.box     { fill: var(--card); stroke: var(--edge); stroke-width: 2; rx: 14; }
.label   { fill: var(--ink);   font: 600 27px 'Segoe UI', system-ui, -apple-system, sans-serif; text-anchor: middle; }
.sub     { fill: var(--muted); font: 400 18px 'Segoe UI', system-ui, -apple-system, sans-serif; text-anchor: middle; }
.on      { fill: var(--on-accent); }
.on-sub  { fill: #E8F0FE; font: 400 18px 'Segoe UI', system-ui, -apple-system, sans-serif; text-anchor: middle; }
.grouptxt{ fill: var(--muted); font: 600 22px 'Segoe UI', system-ui, -apple-system, sans-serif; }
.edgeline{ stroke: var(--edge); stroke-width: 3; fill: none; }
.edgetxt { fill: var(--muted); font: 400 19px 'Segoe UI', system-ui, -apple-system, sans-serif; text-anchor: middle; }
.legend  { fill: var(--muted); font: 400 20px 'Segoe UI', system-ui, -apple-system, sans-serif; }
.foot    { fill: var(--muted); font: 400 19px 'Segoe UI', system-ui, -apple-system, sans-serif; }
.footb   { fill: var(--ink);   font: 700 19px 'Segoe UI', system-ui, -apple-system, sans-serif; }
.ghostbox{ fill: none; stroke: var(--ghost); stroke-width: 2; stroke-dasharray: 8 8; rx: 14; }
.ghosttx { fill: var(--ghost); font: 600 25px 'Segoe UI', system-ui, -apple-system, sans-serif; text-anchor: middle; }
.ghostsub{ fill: var(--ghost); font: 400 18px 'Segoe UI', system-ui, -apple-system, sans-serif; text-anchor: middle; }
  </style>

