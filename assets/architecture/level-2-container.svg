      <path d="M0 0 L10 5 L0 10 z" fill="var(--edge)"/>
    </marker>
    <marker id="a2-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
