    <rect x="424" y="386" width="266" height="200" rx="14" fill="var(--blue)" stroke="var(--blue-d)" stroke-width="3"/>
    <text class="label on" x="557" y="440">Access Auditor</text>
    <text class="on-sub"   x="557" y="474">audit_iam_policy</text>
    <text class="on-sub"   x="557" y="502">deterministic detection</text>
    <text class="on-sub"   x="557" y="552">● ran</text>

    <rect x="707" y="386" width="266" height="200" rx="14" fill="var(--blue)" stroke="var(--blue-d)" stroke-width="3"/>
    <text class="label on" x="840" y="440">Orchestrator</text>
    <text class="on-sub"   x="840" y="474">apply_policy_rules</text>
    <text class="on-sub"   x="840" y="502">route_by_department</text>
    <text class="on-sub"   x="840" y="552">● ran</text>

    <rect x="990" y="386" width="266" height="200" rx="14" fill="var(--blue)" stroke="var(--blue-d)" stroke-width="3"/>
    <text class="label on" x="1123" y="440">Escalation Agent</text>
    <text class="on-sub"   x="1123" y="474">notify_human</text>
    <text class="on-sub"   x="1123" y="502">no IAM read at all</text>
    <text class="on-sub"   x="1123" y="552">● ran</text>
  </g>
  <path class="edgeline" d="M690 486 L700 486" marker-end="url(#a2)"/>
  <path class="edgeline" d="M973 486 L983 486" marker-end="url(#a2)"/>

  <!-- Left column -->
  <g>
    <rect class="ghostbox" x="60" y="180" width="310" height="120"/>
