  <!-- Edges.
       Left-column inputs terminate on the GROUP boundary rather than on the Orchestrator:
       the Orchestrator sits in the middle of the row, so any edge reaching it from the left
       has to cross the Access Auditor. Landing on the boundary says the same thing without
       drawing a line through an unrelated box. Fan-outs are routed orthogonally below the
       group for the same reason. -->

