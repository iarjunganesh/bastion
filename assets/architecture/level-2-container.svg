  <rect class="bg" x="0" y="0" width="1920" height="1080"/>
  <line class="grid" x1="60" y1="150" x2="1860" y2="150"/>
  <line class="grid" x1="60" y1="1000" x2="1860" y2="1000"/>

  <text class="h1" x="60" y="86">Bastion — Level 2 · Container</text>
  <text class="h2" x="60" y="126">The seam per pillar, not a copy of one. Build states measured from gcp-state.json.</text>

