  <text class="footb" x="1860" y="1046" text-anchor="end">Measured 2026-08-15 · 20 of 20 services enabled · NOT DEPLOYED</text>
  <text class="foot"  x="1860" y="1016" text-anchor="end">One process, one identity. Per-agent service accounts need three deployed apps — see ARCHITECTURE.md.</text>
</svg>
