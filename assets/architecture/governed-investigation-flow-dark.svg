<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080"
     role="img" aria-labelledby="t0 d0">
  <title id="t0">Bastion — governed investigation flow</title>
  <desc id="d0">One investigation, end to end. A Pub/Sub event reaches Eventarc, which invokes the
  Cloud Run durable ingress over OIDC; that boundary owns the inbox, lease, retry and dedup and
  invokes the managed Agent Runtime, which carries Agent Identity. All egress leaves through the
  Agent Gateway, where IAP and the Registry allowlist admit each destination by default deny. Two
  protected A2A workers follow: the Access Auditor reads the live GCP IAM policy read-only, and
  the Escalation Agent reaches only the private findings API and holds no IAM read role at all.
  There is no in-process fallback anywhere on this path.</desc>

  <!-- Hand-placed, like every other master here. 16:9 at 1920x1080 so a frame drops straight
       into a recording. Replaces the ASCII flow that used to sit in README.md: a text diagram
       cannot show that the dispatcher never touches a worker, which is the whole point of it. -->
